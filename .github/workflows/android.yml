name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", "index.html", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Copy latest web app into the Android project
        run: cp index.html icon-192.png android/app/src/main/assets/
      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -q
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk tango-quiz.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: たんごクイズ Android版(最新)
          body: |
            Android用アプリ(APK)です。スマホで `tango-quiz.apk` をダウンロードして開くとインストールできます。
            初回は「提供元不明のアプリ」の許可を求められます。
          files: tango-quiz.apk
          prerelease: false
